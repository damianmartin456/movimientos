<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tesorería escolar · Mis Finanzas</title>
<script>window.addEventListener('error',function(e){var v=document.getElementById('v'),t=e.target||{},n=String(t.src||t.href||e.filename||'').split('/').pop().split('?')[0];if(v&&!v.innerHTML)v.innerHTML='<div style="padding:24px;color:#f0566a;font-size:14px">Error al cargar: '+(e.message||'no se pudo cargar')+(n?' ['+n+(e.lineno?':'+e.lineno:'')+']':'')+'</div>'},true)</script>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0a1a17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis Finanzas">
<meta property="og:type" content="website">
<meta property="og:title" content="Mis Finanzas">
<meta property="og:description" content="Finanzas personales y tesorería escolar, guardadas en tu propio Google Drive.">
<meta property="og:image" content="https://damianmartin456.github.io/movimientos/og-image.png">
<meta property="og:url" content="https://damianmartin456.github.io/movimientos/">
<meta name="twitter:card" content="summary_large_image">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="tes.css">
</head>
<body>
<div class="app"><div class="top"><h1 id="ttl"></h1></div><div id="v"></div></div>
<button class="fab" data-a="new" aria-label="Agregar"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<nav><div id="nav"></div></nav>
<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog"></div></div>
<div id="print"></div>
<div id="login" style="position:fixed;inset:0;z-index:50;background:radial-gradient(120% 60% at 50% -10%,#173a33,var(--bg) 55%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center"><img src="logo.png" alt="Mis Finanzas" style="width:min(300px,70vw);height:auto"><p class="m" style="max-width:290px;font-size:15px">Ingresos, recibos y gastos, guardados en tu propio Google Drive.</p><button class="btn" id="lbtn" style="padding:14px 24px;font-size:16px">Continuar con Google</button><button class="btn g" id="loff">Usar sin sincronizar</button><div class="err" id="lerr"></div></div>
<script>try{if(localStorage.getItem('fin.auth'))document.getElementById('login').style.display='none'}catch(e){}</script>
<div class="toast" id="toast"><span id="tm"></span><button id="tu" style="display:none"></button></div>
<script src="t-core.js"></script>
<script src="t-views.js"></script>
<script src="t-forms.js"></script>
<script src="t-extra.js"></script>
<script src="t-report.js"></script>
<script src="t-alu.js"></script>
<script src="t-info.js"></script>
<script src="t-backup.js"></script>
<script src="t-cloud.js"></script>
<script>setTimeout(function(){var F=['style.css','tes.css','t-core.js','t-views.js','t-forms.js','t-extra.js','t-report.js','t-alu.js','t-info.js','t-backup.js','t-cloud.js'];Promise.all(F.map(function(f){return fetch(f,{cache:'no-store'}).then(function(r){return r.text().then(function(t){return [f,r.ok&&t.trim().charAt(0)!=='<']})}).catch(function(){return [f,false]})})).then(function(R){var bad=R.filter(function(x){return !x[1]}).map(function(x){return x[0]}),v=document.getElementById('v'),ok=document.getElementById('nav').innerHTML;if(bad.length||!ok){v.innerHTML='<div style="padding:24px;color:#f0566a;font-size:14px">'+(bad.length?'Faltan o están dañados estos archivos: <b>'+bad.join(', ')+'</b>. Súbelos de nuevo a GitHub y recarga con Ctrl+Shift+R.':'La página no terminó de cargar. Recarga con Ctrl+Shift+R.')+'</div>'}})},2500)</script>
</body>
</html>
