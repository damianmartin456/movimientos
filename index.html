<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Movimientos</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0a1a17">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0a1a17;--bg2:#0f2420;--card:#101d33;--line:#1e2f4d;--ink:#f2f5f3;--mute:#8b9bb0;--mint:#5eead4;--mi:#052e28;--red:#f0566a;--green:#4ade80;--amb:#fbbf24;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;background:radial-gradient(120% 60% at 50% -10%,#173a33,var(--bg) 55%);color:var(--ink);font-family:Inter,system-ui,sans-serif}
.app{max-width:480px;margin:0 auto;padding:16px 18px calc(150px + env(safe-area-inset-bottom,0px))}
h1{font-family:Fraunces,Georgia,serif;font-size:30px;margin:0;font-weight:700}
h3{font-family:Fraunces,Georgia,serif;margin:22px 0 10px;font-size:19px;display:flex;justify-content:space-between;align-items:center}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.mn{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:14px}
.mn b{color:var(--ink);font-weight:500;min-width:112px;text-align:center;text-transform:capitalize}
.ib{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:9px;width:32px;height:32px;cursor:pointer;font-size:16px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sum div,.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.sum .bal{grid-column:1/-1}
small,.m{color:var(--mute);font-size:12px}
.sum b{display:block;font-size:19px;margin-top:2px;font-variant-numeric:tabular-nums}
.bal b{font-family:Fraunces,Georgia,serif;font-size:27px}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 14px;margin-bottom:12px}
.search input{flex:1;background:none;border:0;outline:0;color:var(--ink);font:inherit;padding:13px 0;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chip{flex:none;font:inherit;font-size:14px;color:var(--mute);background:none;border:1px solid var(--line);border-radius:999px;padding:7px 15px;cursor:pointer}
.chip.on{background:var(--mint);border-color:var(--mint);color:var(--mi);font-weight:600}
.tags .chip.on{background:none;color:var(--mint)}
.dh{color:var(--mute);font-size:13px;margin:14px 2px 6px}
.list{display:flex;flex-direction:column;gap:8px}
.tx{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.ico{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center}
.ico svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mid{flex:1;min-width:0}.mid b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}.out{color:var(--red)}.in{color:var(--green)}.tr{color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:34px 10px}
.bar{height:8px;background:#1a2a47;border-radius:9px;overflow:hidden;margin:7px 0 3px}.bar i{display:block;height:100%;background:var(--mint);border-radius:9px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.in2,.f input,.f select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;color-scheme:dark;min-width:0}
.in2{width:96px;text-align:right}
.btn{font:inherit;font-size:14px;font-weight:600;background:var(--mint);color:var(--mi);border:0;border-radius:10px;padding:9px 14px;cursor:pointer}
.btn.g{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.x{background:none;border:0;color:var(--mute);cursor:pointer;font-size:18px}
.stack{display:flex;flex-direction:column;gap:8px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:13px;margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
nav{position:fixed;left:0;right:0;bottom:0;background:#0b1816ee;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{font:inherit;font-size:12px;color:var(--mute);background:none;border:0;padding:12px 4px;cursor:pointer}
nav button.on{color:var(--mint);font-weight:600}
.fab{position:fixed;right:max(18px,calc(50% - 222px));bottom:calc(74px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--mint);color:var(--mi);display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 24px rgba(94,234,212,.35);z-index:6}
.fab svg{width:26px;height:26px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.scrim{position:fixed;inset:0;background:rgba(2,8,7,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}.scrim.open{display:flex}
.sheet{width:100%;max-width:480px;max-height:92%;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{font-family:Fraunces,Georgia,serif;margin:0 0 12px;font-size:21px}
.f{display:block;margin-bottom:10px}.f span{display:block;color:var(--mute);font-size:13px;margin-bottom:4px}.f input,.f select{width:100%}
.voice{display:flex;gap:8px;margin-bottom:14px}.voice input{flex:1;font:inherit;color:var(--ink);background:var(--card);border:1px dashed var(--mint);border-radius:10px;padding:10px;min-width:0}
.err{color:var(--red);font-size:13px;min-height:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:#e8fffb;color:#07201c;border-radius:12px;padding:10px 14px;font-size:14px;display:none;gap:12px;align-items:center;z-index:30;max-width:92%}
.toast.on{display:flex}.toast button{background:none;border:0;font:inherit;font-weight:700;color:#0b6b5d;cursor:pointer}
</style>
</head>
<body>

  <div class="top"><h1 id="ttl"></h1><div class="mn" id="mn"><button class="ib" data-a="mp" aria-label="Mes anterior">‹</button><b id="ml"></b><button class="ib" data-a="mx" aria-label="Mes siguiente">›</button></div></div>
  <div id="v"></div>
</div>

<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog"></div></div>
<div id="login" style="position:fixed;inset:0;z-index:50;background:radial-gradient(120% 60% at 50% -10%,#173a33,var(--bg) 55%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center"><h1>Movimientos</h1><p class="m" style="max-width:290px;font-size:15px">Tus finanzas, guardadas en tu propio Google Drive.</p><button class="btn" id="lbtn" style="padding:14px 24px;font-size:16px">Continuar con Google</button><button class="btn g" id="loff">Usar sin sincronizar</button><div class="err" id="lerr"></div></div>
<div class="toast" id="toast"><span id="tm"></span><button id="tu"></button></div>

<script>
const GOOGLE_CLIENT_ID='675111410318-otck2br7ui5hm2kb18das1ulu9i5pcth.apps.googleusercontent.com';

const OUT=['Mercado','Restaurantes','Transporte','Entretenimiento','Salud','Viajes'],TAGS=['Generales','Viajes','Trabajo'],KEY='movimientos.v2';
const iso=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)};
