<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Movimientos</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0a1a17">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0a1a17;--bg2:#0f2420;--card:#101d33;--line:#1e2f4d;--ink:#f2f5f3;--mute:#8b9bb0;--mint:#5eead4;--mi:#052e28;--red:#f0566a;--green:#4ade80;--amb:#fbbf24;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;background:radial-gradient(120% 60% at 50% -10%,#173a33,var(--bg) 55%);color:var(--ink);font-family:Inter,system-ui,sans-serif}
.app{max-width:480px;margin:0 auto;padding:16px 18px calc(150px + env(safe-area-inset-bottom,0px))}
h1{font-family:Fraunces,Georgia,serif;font-size:30px;margin:0;font-weight:700}
h3{font-family:Fraunces,Georgia,serif;margin:22px 0 10px;font-size:19px;display:flex;justify-content:space-between;align-items:center}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.mn{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:14px}
.mn b{color:var(--ink);font-weight:500;min-width:112px;text-align:center;text-transform:capitalize}
.ib{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:9px;width:32px;height:32px;cursor:pointer;font-size:16px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sum div,.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.sum .bal{grid-column:1/-1}
small,.m{color:var(--mute);font-size:12px}
.sum b{display:block;font-size:19px;margin-top:2px;font-variant-numeric:tabular-nums}
.bal b{font-family:Fraunces,Georgia,serif;font-size:27px}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 14px;margin-bottom:12px}
.search input{flex:1;background:none;border:0;outline:0;color:var(--ink);font:inherit;padding:13px 0;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chip{flex:none;font:inherit;font-size:14px;color:var(--mute);background:none;border:1px solid var(--line);border-radius:999px;padding:7px 15px;cursor:pointer}
.chip.on{background:var(--mint);border-color:var(--mint);color:var(--mi);font-weight:600}
.tags .chip.on{background:none;color:var(--mint)}
.dh{color:var(--mute);font-size:13px;margin:14px 2px 6px}
.list{display:flex;flex-direction:column;gap:8px}
.tx{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.ico{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center}
.ico svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mid{flex:1;min-width:0}.mid b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}.out{color:var(--red)}.in{color:var(--green)}.tr{color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:34px 10px}
.bar{height:8px;background:#1a2a47;border-radius:9px;overflow:hidden;margin:7px 0 3px}.bar i{display:block;height:100%;background:var(--mint);border-radius:9px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.in2,.f input,.f select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;color-scheme:dark;min-width:0}
.in2{width:96px;text-align:right}
.btn{font:inherit;font-size:14px;font-weight:600;background:var(--mint);color:var(--mi);border:0;border-radius:10px;padding:9px 14px;cursor:pointer}
.btn.g{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.x{background:none;border:0;color:var(--mute);cursor:pointer;font-size:18px}
.stack{display:flex;flex-direction:column;gap:8px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:13px;margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
nav{position:fixed;left:0;right:0;bottom:0;background:#0b1816ee;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{font:inherit;font-size:12px;color:var(--mute);background:none;border:0;padding:12px 4px;cursor:pointer}
nav button.on{color:var(--mint);font-weight:600}
.fab{position:fixed;right:max(18px,calc(50% - 222px));bottom:calc(74px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--mint);color:var(--mi);display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 24px rgba(94,234,212,.35);z-index:6}
.fab svg{width:26px;height:26px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.scrim{position:fixed;inset:0;background:rgba(2,8,7,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}.scrim.open{display:flex}
.sheet{width:100%;max-width:480px;max-height:92%;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{font-family:Fraunces,Georgia,serif;margin:0 0 12px;font-size:21px}
.f{display:block;margin-bottom:10px}.f span{display:block;color:var(--mute);font-size:13px;margin-bottom:4px}.f input,.f select{width:100%}
.voice{display:flex;gap:8px;margin-bottom:14px}.voice input{flex:1;font:inherit;color:var(--ink);background:var(--card);border:1px dashed var(--mint);border-radius:10px;padding:10px;min-width:0}
.err{color:var(--red);font-size:13px;min-height:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:#e8fffb;color:#07201c;border-radius:12px;padding:10px 14px;font-size:14px;display:none;gap:12px;align-items:center;z-index:30;max-width:92%}
.toast.on{display:flex}.toast button{background:none;border:0;font:inherit;font-weight:700;color:#0b6b5d;cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <div class="top"><h1 id="ttl"></h1><div class="mn" id="mn"><button class="ib" data-a="mp" aria-label="Mes anterior">‹</button><b id="ml"></b><button class="ib" data-a="mx" aria-label="Mes siguiente">›</button></div></div>
  <div id="v"></div>
</div>
<button class="fab" data-a="new" aria-label="Agregar movimiento"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<nav><div id="nav"></div></nav>
<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog"></div></div>
<div id="login" style="position:fixed;inset:0;z-index:50;background:radial-gradient(120% 60% at 50% -10%,#173a33,var(--bg) 55%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center"><h1>Movimientos</h1><p class="m" style="max-width:290px;font-size:15px">Tus finanzas, guardadas en tu propio Google Drive.</p><button class="btn" id="lbtn" style="padding:14px 24px;font-size:16px">Continuar con Google</button><button class="btn g" id="loff">Usar sin sincronizar</button><div class="err" id="lerr"></div></div>
<div class="toast" id="toast"><span id="tm"></span><button id="tu"></button></div>

<script>
const GOOGLE_CLIENT_ID='675111410318-otck2br7ui5hm2kb18das1ulu9i5pcth.apps.googleusercontent.com';
const IC={Mercado:['#34d399','M9 20a1 1 0 1 0 0 .01M18 20a1 1 0 1 0 0 .01M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6'],Restaurantes:['#fb923c','M4 3v8a3 3 0 0 0 3 3v7M7 3v8M10 3v8a3 3 0 0 1-3 3M17 3c-2 2-3 5-3 8h3v10'],Transporte:['#fbbf24','M3 17h18M3 13l2-6h14l2 6v4H3zM7 17v2M17 17v2'],Entretenimiento:['#60a5fa','M2 11a4 4 0 0 1 4-4h12a4 4 0 0 1 4 4v2a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4zM7 10v4M5 12h4M16 11h.01M18 13h.01'],Salud:['#f472b6','M20.8 5.6a5.5 5.5 0 0 0-7.8 0L12 6.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 22l8.8-8.6a5.5 5.5 0 0 0 0-7.8z'],Viajes:['#a78bfa','M2 16l20-6L2 4v5l14 1-14 1z'],Ingresos:['#4ade80','M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6'],Transferencia:['#94a3b8','M7 7h13l-4-4M17 17H4l4 4']};
const OUT=['Mercado','Restaurantes','Transporte','Entretenimiento','Salud','Viajes'],TAGS=['Generales','Viajes','Trabajo'],KEY='movimientos.v2';
const iso=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)};
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const money=n=>n.toLocaleString('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0});
const cur=iso(0).slice(0,7);
let D;try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!D)D={acc:[{id:'a1',n:'Efectivo',s:0},{id:'a2',n:'Débito',s:0},{id:'a3',n:'Crédito',s:0}],
tx:[],bud:{},goals:[],rec:[]};
const save=()=>{D.u=Date.now();try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}window.cloudPush&&cloudPush()};
const S={v:'mov',m:cur,q:'',type:'all',tag:'all'};
// recurrentes: se registran solos al llegar su día
function genRec(){let ch=0;D.rec.forEach(r=>{if(r.last!==cur&&new Date().getDate()>=r.day){D.tx.push({id:Date.now()+Math.random(),t:r.t,c:r.c,k:r.k,tag:'Generales',a:r.a,d:cur+'-'+String(Math.min(r.day,28)).padStart(2,'0'),acc:r.acc});r.last=cur;ch=1}});ch&&save()}
genRec();
const accName=id=>(D.acc.find(a=>a.id===id)||{n:'—'}).n;
const bal=a=>D.tx.reduce((s,x)=>x.acc===a.id?s+(x.t==='in'?x.a:-x.a):x.to===a.id&&x.t==='tr'?s+x.a:s,a.s);
const inM=x=>x.d.startsWith(S.m);
const sumM=t=>D.tx.filter(x=>inM(x)&&x.t===t).reduce((s,x)=>s+x.a,0);
const mlabel=m=>new Date(m+'-15T12:00').toLocaleDateString('es-MX',{month:'long',year:'numeric'});
const dlabel=d=>d===iso(0)?'Hoy':d===iso(1)?'Ayer':new Date(d+'T12:00').toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'short'});
function toast(m,fn){$('tm').textContent=m;const b=$('tu');b.textContent=fn?'Deshacer':'';b.style.display=fn?'':'none';b.onclick=()=>{fn&&fn();$('toast').classList.remove('on')};$('toast').classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('on'),4500)}
const chips=(a,items,c)=>items.map(([v,l])=>`<button class="chip${v===c?' on':''}" data-a="${a}" data-v="${v}">${l}</button>`).join('');
const ico=k=>{const [c,p]=IC[k]||IC.Mercado;return `<div class="ico" style="background:${c}22;color:${c}"><svg viewBox="0 0 24 24"><path d="${p}"/></svg></div>`};

function vMov(){
  const q=S.q.trim().toLowerCase();
  const rows=D.tx.filter(x=>inM(x)&&(S.type==='all'||x.t===S.type)&&(S.tag==='all'||x.tag===S.tag)&&(!q||(x.c+' '+x.k+' '+x.tag).toLowerCase().includes(q))).sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id);
  let h=`<div class="sum"><div class="bal"><small>Balance total en cuentas</small><b>${money(D.acc.reduce((s,a)=>s+bal(a),0))}</b></div><div><small>Ingresos del mes</small><b class="in">${money(sumM('in'))}</b></div><div><small>Gastos del mes</small><b class="out">${money(sumM('out'))}</b></div></div>
  <label class="search"><input id="q" type="search" placeholder="Buscar transacciones…" value="${esc(S.q)}" aria-label="Buscar"></label>
  <div class="chips">${chips('type',[['all','Todos'],['in','Ingresos'],['out','Gastos'],['tr','Transferencias']],S.type)}</div>
  <div class="chips tags">${chips('tag',[['all','Todos'],...TAGS.map(t=>[t,t])],S.tag)}</div>`;
  if(!rows.length)return h+'<div class="empty">No hay movimientos con esos filtros. Toca + para agregar uno.</div>';
  let last='';
  rows.forEach(x=>{if(x.d!==last){h+=`<div class="dh">${dlabel(x.d)}</div>`;last=x.d}
    h+=`<div class="tx list" data-a="edit" data-id="${x.id}" style="flex-direction:row"><span style="display:contents">${ico(x.t==='tr'?'Transferencia':x.k)}</span><div class="mid"><b>${esc(x.c)}</b><span class="m">${x.t==='tr'?accName(x.acc)+' → '+accName(x.to):x.k+' · '+accName(x.acc)}</span></div><div class="amt ${x.t}">${x.t==='out'?'−':x.t==='in'?'+':''}${money(x.a)}</div></div>`});
  return h}

function vRes(){
  const by={};D.tx.filter(x=>inM(x)&&x.t==='out').forEach(x=>by[x.k]=(by[x.k]||0)+x.a);
  const tot=Object.values(by).reduce((a,b)=>a+b,0),ents=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  let off=0;const arcs=ents.map(([k,v])=>{const l=v/tot*251.3,s=`<circle r="40" cx="60" cy="60" fill="none" stroke="${IC[k][0]}" stroke-width="16" stroke-dasharray="${l} ${251.3-l}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=l;return s}).join('');
  const ms=[];for(let i=5;i>=0;i--){const d=new Date(S.m+'-15T12:00');d.setMonth(d.getMonth()-i);ms.push(d.toISOString().slice(0,7))}
  const f=(m,t)=>D.tx.filter(x=>x.d.startsWith(m)&&x.t===t).reduce((s,x)=>s+x.a,0),mx=Math.max(1,...ms.flatMap(m=>[f(m,'in'),f(m,'out')]));
  const bars=ms.map((m,i)=>{const a=f(m,'in')/mx*90,b=f(m,'out')/mx*90,x=12+i*48;return `<rect x="${x}" y="${100-a}" width="16" height="${a}" rx="3" fill="#4ade80"/><rect x="${x+18}" y="${100-b}" width="16" height="${b}" rx="3" fill="#f0566a"/><text x="${x+17}" y="116" text-anchor="middle" font-size="10" fill="#8b9bb0">${new Date(m+'-15T12:00').toLocaleDateString('es-MX',{month:'short'})}</text>`}).join('');
  return `<h3>Gastos por categoría</h3><div class="box">${tot?`<svg viewBox="0 0 120 120" width="150" height="150" style="display:block;margin:0 auto">${arcs}<text x="60" y="64" text-anchor="middle" font-size="13" font-weight="600" fill="#f2f5f3">${money(tot)}</text></svg><div class="legend">${ents.map(([k,v])=>`<div><i style="background:${IC[k][0]}"></i>${k} <b>${Math.round(v/tot*100)}%</b></div>`).join('')}</div>`:'<div class="empty">Sin gastos este mes.</div>'}</div>
  <h3>Ingresos y gastos</h3><div class="box"><svg viewBox="0 0 300 122" width="100%" role="img" aria-label="Ingresos y gastos de los últimos seis meses">${bars}</svg><div class="m"><span class="in">■</span> Ingresos &nbsp; <span class="out">■</span> Gastos</div></div>
  <h3>Respaldo</h3><div class="row"><button class="btn g" data-a="csv">Exportar CSV</button></div>`}

function vBud(){
  return `<h3>Presupuesto de ${mlabel(S.m)}</h3><div class="stack">`+OUT.map(k=>{
    const sp=D.tx.filter(x=>inM(x)&&x.t==='out'&&x.k===k).reduce((s,x)=>s+x.a,0),l=D.bud[k]||0,p=l?sp/l*100:0;
    return `<div class="box"><div class="row"><div class="row" style="justify-content:flex-start">${ico(k)}<b>${k}</b></div><input class="in2" type="number" inputmode="numeric" min="0" placeholder="Límite" value="${l||''}" data-a="bud" data-k="${k}" aria-label="Límite de ${k}"></div>
    <div class="bar"><i style="width:${Math.min(100,p)}%;background:${p>=100?'var(--red)':p>=80?'var(--amb)':'var(--mint)'}"></i></div><span class="m">${money(sp)} gastado${l?' de '+money(l)+' · '+(sp>l?'te pasaste '+money(sp-l):'quedan '+money(l-sp)):' · sin límite'}</span></div>`}).join('')+'</div>'}

function vMas(){
  return `<h3>Cuentas y tarjetas <button class="btn g" data-a="nacc">+ Cuenta</button></h3><div class="stack">${D.acc.map(a=>`<div class="box row"><b>${esc(a.n)}</b><span class="row"><span class="amt ${bal(a)<0?'out':''}">${money(bal(a))}</span><button class="x" data-a="dacc" data-id="${a.id}" aria-label="Eliminar ${esc(a.n)}">×</button></span></div>`).join('')}</div>
  <h3>Metas de ahorro <button class="btn g" data-a="ngoal">+ Meta</button></h3><div class="stack">${D.goals.map(g=>{const p=Math.min(100,g.s/g.t*100);return `<div class="box"><div class="row"><b>${esc(g.n)}</b><button class="x" data-a="dgoal" data-id="${g.id}" aria-label="Eliminar meta">×</button></div><div class="bar"><i style="width:${p}%"></i></div><div class="row"><span class="m">${money(g.s)} de ${money(g.t)} · ${Math.round(p)}%</span><input class="in2" type="number" inputmode="numeric" placeholder="+ Abonar" data-a="abono" data-id="${g.id}" aria-label="Abonar a ${esc(g.n)}"></div></div>`}).join('')||'<div class="empty">Crea tu primera meta.</div>'}</div>
  <h3>Recurrentes <button class="btn g" data-a="nrec">+ Recurrente</button></h3><div class="stack">${D.rec.map(r=>`<div class="box row"><div><b>${esc(r.c)}</b><br><span class="m">Día ${r.day} de cada mes · ${accName(r.acc)}</span></div><span class="row"><span class="amt ${r.t}">${money(r.a)}</span><button class="x" data-a="drec" data-id="${r.id}" aria-label="Eliminar ${esc(r.c)}">×</button></span></div>`).join('')||'<div class="empty">Sin movimientos recurrentes.</div>'}</div>${cloudBox()}`}

const TT={mov:'Movimientos',res:'Resumen',bud:'Presupuestos',mas:'Más'};
function render(){
  $('ttl').textContent=TT[S.v];$('mn').style.visibility=S.v==='mas'?'hidden':'';$('ml').textContent=mlabel(S.m);
  $('nav').innerHTML=Object.entries(TT).map(([k,l])=>`<button class="${k===S.v?'on':''}" data-a="tab" data-v="${k}">${l}</button>`).join('');
  $('v').innerHTML={mov:vMov,res:vRes,bud:vBud,mas:vMas}[S.v]();
  const q=$('q');if(q)q.oninput=e=>{S.q=e.target.value;const p=e.target.selectionStart;render();const n=$('q');n.focus();n.setSelectionRange(p,p)}}

// formulario genérico en hoja inferior
function sheet(title,fields,onSave,extra){
  $('sheet').innerHTML=`<h2>${title}</h2>${extra&&extra.top||''}`+fields.map(f=>`<label class="f"><span>${f.l}</span>${f.o?`<select id="f_${f.k}">${f.o.map(o=>{const[v,l]=Array.isArray(o)?o:[o,o];return `<option value="${v}"${v===f.v?' selected':''}>${l}</option>`}).join('')}</select>`:`<input id="f_${f.k}" type="${f.type||'text'}" ${f.type==='number'?'inputmode="decimal" min="0" step="0.01"':''} value="${esc(f.v??'')}" placeholder="${f.p||''}">`}</label>`).join('')+`<div class="err" id="err"></div><div class="row"><button class="btn" id="sv" style="flex:1;padding:13px">Guardar</button>${extra&&extra.del?'<button class="btn g" id="dl" style="padding:13px">Eliminar</button>':''}</div>`;
  $('scrim').classList.add('open');
  $('sv').onclick=()=>{const o={};fields.forEach(f=>o[f.k]=$('f_'+f.k).value);const e=onSave(o);if(e)$('err').textContent=e;else{$('scrim').classList.remove('open');save();render()}};
  if(extra&&extra.del)$('dl').onclick=()=>{$('scrim').classList.remove('open');extra.del()};
  if(extra&&extra.init)extra.init()}
const close=()=>$('scrim').classList.remove('open');
const accO=()=>D.acc.map(a=>[a.id,a.n]);

function txSheet(x){
  const ed=!!x;x=x||{t:'out',k:'Mercado',tag:'Generales',d:iso(0),acc:D.acc[0]&&D.acc[0].id};
  const top=ed?'':`<div class="voice"><input id="vi" placeholder="Di o escribe: gasté 250 en café con débito" aria-label="Captura con IA"><button class="btn g" id="mic" aria-label="Dictar">🎤</button><button class="btn" id="go">IA</button></div>`;
  sheet(ed?'Editar movimiento':'Nuevo movimiento',[{k:'t',l:'Tipo',o:[['out','Gasto'],['in','Ingreso'],['tr','Transferencia']],v:x.t},{k:'c',l:'Concepto',v:x.c,p:'Ej. Tacos, Nómina'},{k:'a',l:'Monto',type:'number',v:x.a,p:'0.00'},{k:'k',l:'Categoría',o:[...OUT,'Ingresos'],v:x.k},{k:'acc',l:'Cuenta',o:accO(),v:x.acc},{k:'to',l:'Cuenta destino (solo transferencias)',o:accO(),v:x.to||x.acc},{k:'tag',l:'Etiqueta',o:TAGS,v:x.tag},{k:'d',l:'Fecha',type:'date',v:x.d}],o=>{
    const a=parseFloat(o.a);if(o.t!=='tr'&&!o.c.trim())return 'Escribe un concepto.';if(!(a>0))return 'Ingresa un monto mayor a cero.';
    if(o.t==='tr'&&o.acc===o.to)return 'Elige cuentas distintas.';
    const n={id:x.id||Date.now(),t:o.t,c:o.t==='tr'?'Transferencia':o.c.trim(),a,k:o.t==='in'?'Ingresos':o.k,tag:o.tag,d:o.d||iso(0),acc:o.acc,to:o.t==='tr'?o.to:undefined};
    D.tx=ed?D.tx.map(y=>y.id===x.id?n:y):[...D.tx,n]},
    {top,del:ed?()=>{const old=x;D.tx=D.tx.filter(y=>y.id!==old.id);save();render();toast('Movimiento eliminado',()=>{D.tx.push(old);save();render()})}:null,init:ed?null:voiceInit});
}
function fill(j){const s=(k,v)=>{const e=$('f_'+k);if(e&&v!=null&&[...(e.options||[{value:v}])].some(o=>o.value==v))e.value=v};
  s('t',j.t);if(j.c)$('f_c').value=j.c;if(j.a)$('f_a').value=j.a;s('k',j.k);s('tag',j.tag);if(j.d)$('f_d').value=j.d;const a=D.acc.find(a=>a.n.toLowerCase()===String(j.acc||'').toLowerCase());if(a)s('acc',a.id)}
async function ai(){
  const t=$('vi').value.trim();if(!t)return;$('err').textContent='Interpretando…';
  try{const sm=window.claude&&await claude.use('sample');if(!sm){fill(parseVoz(t));$('err').textContent='Interpretado sin IA: revisa los datos y guarda.';return}
    const j=await sm.json(`Hoy es ${iso(0)}. Convierte esta frase de finanzas personales en JSON con exactamente estas claves: t ("out" gasto, "in" ingreso, "tr" transferencia), c (concepto corto), a (número), k (una de ${[...OUT,'Ingresos'].join(', ')}), tag (una de ${TAGS.join(', ')}), acc (una de ${D.acc.map(a=>a.n).join(', ')} o null), d (fecha AAAA-MM-DD; "ayer" = ${iso(1)}). Responde solo el JSON. Frase: "${t.replace(/"/g,"'")}"`,{modelTier:'quick'});
    fill(j);$('err').textContent='Listo: revisa los datos y guarda.'}catch(e){$('err').textContent='No pude interpretarlo. Intenta de nuevo o llena el formulario.'}}
function voiceInit(){
  $('go').onclick=ai;$('vi').onkeydown=e=>{if(e.key==='Enter')ai()};
  $('mic').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){$('err').textContent='Este navegador no dicta: escribe la frase y toca IA.';return}
    try{const r=new R();r.lang='es-MX';r.onresult=e=>{$('vi').value=e.results[0][0].transcript;ai()};r.onerror=()=>{$('err').textContent='No pude escuchar. Escribe la frase.'};r.start();$('err').textContent='Escuchando…'}catch(e){$('err').textContent='No pude usar el micrófono.'}}}

document.addEventListener('click',e=>{
  if(e.target===$('scrim'))return close();
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id,v=b.dataset.v;
  if(a==='tab'){S.v=v;render()}
  else if(a==='mp'||a==='mx'){const d=new Date(S.m+'-15T12:00');d.setMonth(d.getMonth()+(a==='mx'?1:-1));S.m=d.toISOString().slice(0,7);render()}
  else if(a==='type'){S.type=v;render()}else if(a==='tag'){S.tag=v;render()}
  else if(a==='new')txSheet();
  else if(a==='edit')txSheet(D.tx.find(x=>String(x.id)===id));
  else if(a==='nacc')sheet('Nueva cuenta',[{k:'n',l:'Nombre',p:'Ej. Tarjeta Nu'},{k:'s',l:'Saldo inicial',type:'number',v:0}],o=>{if(!o.n.trim())return 'Escribe un nombre.';D.acc.push({id:'a'+Date.now(),n:o.n.trim(),s:parseFloat(o.s)||0})});
  else if(a==='ngoal')sheet('Nueva meta',[{k:'n',l:'Nombre',p:'Ej. Laptop'},{k:'t',l:'Monto objetivo',type:'number'}],o=>{if(!o.n.trim()||!(+o.t>0))return 'Completa nombre y monto.';D.goals.push({id:'g'+Date.now(),n:o.n.trim(),t:+o.t,s:0})});
  else if(a==='nrec')sheet('Nuevo recurrente',[{k:'t',l:'Tipo',o:[['out','Gasto'],['in','Ingreso']]},{k:'c',l:'Concepto',p:'Ej. Renta'},{k:'a',l:'Monto',type:'number'},{k:'k',l:'Categoría',o:[...OUT,'Ingresos']},{k:'acc',l:'Cuenta',o:accO()},{k:'day',l:'Día del mes (1-28)',type:'number',v:1}],o=>{if(!o.c.trim()||!(+o.a>0))return 'Completa concepto y monto.';const d=Math.min(28,Math.max(1,parseInt(o.day)||1));D.rec.push({id:'r'+Date.now(),t:o.t,c:o.c.trim(),a:+o.a,k:o.t==='in'?'Ingresos':o.k,acc:o.acc,day:d,last:cur})});
  else if(a==='dacc'){if(D.tx.some(x=>x.acc===id||x.to===id))return toast('Esa cuenta tiene movimientos');D.acc=D.acc.filter(x=>x.id!==id);save();render()}
  else if(a==='dgoal'){D.goals=D.goals.filter(x=>x.id!==id);save();render()}
  else if(a==='drec'){D.rec=D.rec.filter(x=>x.id!==id);save();render()}
  else if(a==='csv')exportCsv();
});
document.addEventListener('change',e=>{const t=e.target,a=t.dataset.a;
  if(a==='bud'){D.bud[t.dataset.k]=Math.max(0,+t.value||0);save();render()}
  else if(a==='abono'){const g=D.goals.find(x=>x.id===t.dataset.id),n=+t.value;if(g&&n>0){g.s+=n;save();render()}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
async function exportCsv(){
  const rows=[['fecha','tipo','concepto','categoria','etiqueta','cuenta','monto'],...D.tx.sort((a,b)=>a.d.localeCompare(b.d)).map(x=>[x.d,x.t,x.c,x.k,x.tag,accName(x.acc),x.a])];
  const csv='\ufeff'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  try{const d=window.claude&&await claude.use('downloads');if(!d)return toast('La descarga no está disponible aquí');await d.save({filename:'movimientos.csv',data:csv})}catch(e){if(!e||e.code!=='declined')toast('No se pudo exportar')}}
// ===== Google login + Drive (carpeta oculta appDataFolder) =====
const CLOUD={id:null,tok:null,tc:null,st:'',t:null};
const SC='https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/userinfo.email';
const setSt=s=>{CLOUD.st=s;const e=$('syn');if(e)e.textContent=s};
function cloudBox(){return `<h3>Cuenta de Google</h3><div class="box"><div class="row"><span class="m" id="syn">${esc(CLOUD.st||'Sin conexión con Drive')}</span><span class="row"><button class="btn g" data-a="syncnow">Sincronizar</button><button class="btn g" data-a="logout">Salir</button></span></div></div>`}
async function api(url,opt={},retry=true){
  const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+CLOUD.tok}});
  if(r.status===401&&retry){await getTok(true);return api(url,opt,false)}
  if(!r.ok)throw new Error('HTTP '+r.status);return r}
function getTok(silent){return new Promise((res,rej)=>{
  CLOUD.tc.callback=r=>{if(r.error)rej(r);else{CLOUD.tok=r.access_token;try{localStorage.setItem('fin.auth','1')}catch(e){}res()}};
  CLOUD.tc.error_callback=rej;CLOUD.tc.requestAccessToken({prompt:silent?'none':''})})}
async function findF(){const r=await api('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id)&q='+encodeURIComponent("name='movimientos.json'"));const j=await r.json();return j.files[0]?j.files[0].id:null}
async function pull(){CLOUD.id=await findF();if(!CLOUD.id)return null;return (await api('https://www.googleapis.com/drive/v3/files/'+CLOUD.id+'?alt=media')).json()}
async function push(){
  setSt('Guardando en Drive…');const body=JSON.stringify(D);
  if(!CLOUD.id){const b='fb'+Date.now(),m=JSON.stringify({name:'movimientos.json',parents:['appDataFolder']});
    const r=await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:`--${b}\r\nContent-Type: application/json\r\n\r\n${m}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`});
    CLOUD.id=(await r.json()).id}
  else await api('https://www.googleapis.com/upload/drive/v3/files/'+CLOUD.id+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body});
  setSt('Guardado en Drive · '+new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}))}
window.cloudPush=()=>{if(!CLOUD.tok)return;setSt('Cambios sin guardar…');clearTimeout(CLOUD.t);CLOUD.t=setTimeout(()=>push().catch(()=>setSt('Error al guardar. Toca Sincronizar.')),1500)};
async function start(){
  setSt('Cargando desde Drive…');
  try{const r=await pull();
    if(r&&r.u>(D.u||0)){D=r;try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
    else if(!r||(D.u||0)>r.u)await push();
    else setSt('Sincronizado');
    genRec();render();$('login').style.display='none';
  }catch(e){setSt('No se pudo conectar con Drive');$('lerr').textContent='No se pudo leer tu Drive. Revisa la configuración del Client ID.'}}
function initG(){
  if(!GOOGLE_CLIENT_ID||GOOGLE_CLIENT_ID.startsWith('PEGA')){$('lerr').textContent='Falta configurar el Client ID de Google (ver LEEME.md).';return}
  if(!window.google||!google.accounts)return setTimeout(initG,250);
  CLOUD.tc=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:SC,callback:()=>{}});
  if(localStorage.getItem('fin.auth'))getTok(true).then(start).catch(()=>{})}
$('lbtn').onclick=async()=>{$('lerr').textContent='';if(!CLOUD.tc){$('lerr').textContent=(!window.google?'No cargó el script de Google (bloqueador o sin conexión).':'Falta configurar el Client ID.');return}try{await getTok(false);await start()}catch(e){$('lerr').textContent='Error: '+(e&&(e.type||e.error||e.message)||'desconocido')}};
$('loff').onclick=()=>{$('login').style.display='none'};
document.addEventListener('click',e=>{
  if(e.target.closest('[data-a="syncnow"]')&&CLOUD.tok)start();
  if(e.target.closest('[data-a="logout"]')){try{localStorage.removeItem('fin.auth');localStorage.removeItem(KEY)}catch(x){}
    if(CLOUD.tok&&window.google)google.accounts.oauth2.revoke(CLOUD.tok,()=>{});location.reload()}});
// Dictado sin IA: interpreta frases simples en español
function parseVoz(t){const s=t.toLowerCase(),n=s.match(/(\d+(?:[.,]\d+)?)/);
  const K={Mercado:/super|mercado|despensa|walmart|soriana|chedraui/,Restaurantes:/caf[eé]|taco|com[ií]|restaurante|cena|desayuno|pizza|torta/,Transporte:/uber|didi|gasolina|taxi|metro|cami[oó]n|caseta/,Entretenimiento:/cine|netflix|spotify|juego|concierto/,Salud:/doctor|farmacia|medicina|dentista|consulta/,Viajes:/vuelo|hotel|viaje|hospedaje/};
  const m=s.match(/\b(?:en|de|por)\s+(?:el |la |un |una )?([a-záéíóúñ ]+?)(?:\s+(?:con|de la|ayer|hoy)\b|$)/);
  return{t:/transfer/.test(s)?'tr':/cobr[eé]|recib[ií]|n[oó]mina|me pagaron|ingreso|sueldo/.test(s)?'in':'out',a:n?parseFloat(n[1].replace(',','.')):null,k:Object.keys(K).find(x=>K[x].test(s)),tag:/viaje|vuelo|hotel/.test(s)?'Viajes':'Generales',c:m?m[1].trim().replace(/^./,c=>c.toUpperCase()):null,acc:(D.acc.find(a=>s.includes(a.n.toLowerCase()))||{}).n,d:/ayer/.test(s)?iso(1):iso(0)}}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});

render();
initG();
</script>
